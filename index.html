    <style>
:root{
 --bg-color: #bfbfbf;
 --bg-secondary: #0d0d0d;
 --panel-bg: rgba(28, 28, 30, 0.72);
 --panel-border: rgba(255, 255, 255, 0.08);
 --glass-bg: rgba(44, 44, 46, 0.65);
 --glass-border: rgba(255, 255, 255, 0.1);
 --accent-blue: #0A84FF;
 --accent-green: #30D158;
 --accent-red: #FF453A;
 --accent-orange: #FF9F0A;
 --accent-purple: #BF5AF2;
 --accent-pink: #FF375F;
 --accent-teal: #64D2FF;
 --accent-crawl: #00FC93;
 --text-primary: #FFFFFF;
 --text-secondary: rgba(255, 255, 255, 0.55);
 --text-tertiary: rgba(255, 255, 255, 0.25);
 --header-height: 56px;
 --crawl-height: 65px;
 --radius-sm: 8px;
 --radius-md: 12px;
 --radius-lg: 16px;
 --radius-xl: 20px;
 --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
 --shadow-md: 0 4px 24px rgba(0, 0, 0, 0.4);
 --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
 --anim: 0.15s ease-in-out;
 --anim-fast: 0.1s ease-in-out;
 --anim-med: 0.2s ease-in-out;
}

*{box-sizing:border-box;margin:0;padding:0;transition: all var(--anim);}
html,body{height:100%;width:100%}

body{
 padding: 28px;
 background-color: #00180e;
 background: var(--bg-color);
 background-image: 
   radial-gradient(ellipse at top left, rgba(10, 132, 255, 0.08) 0%, transparent 50%),
   radial-gradient(ellipse at bottom right, rgba(191, 90, 242, 0.06) 0%, transparent 50%);
 color: var(--text-primary);
 font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
 height:100vh;
 width:100vw;
 overflow:hidden;
 display:flex;
 flex-direction: column;
 -webkit-font-smoothing: antialiased;
 -moz-osx-font-smoothing: grayscale;
}

#news-ticker {
 width: 100%;
 height: var(--crawl-height);
 background: linear-gradient(90deg, #111 0%, #0a0a0a 50%, #111 100%);
 display: flex;
 align-items: center;
 overflow: hidden;
 position: relative;
 flex-shrink: 0;
 z-index: 100;
 border-top: 2px solid var(--accent-crawl);
}

.ticker-icon {
 display: flex;
 align-items: center;
 justify-content: center;
 padding: 0 16px;
 flex-shrink: 0;
 height: 100%;
 background: rgba(0, 30, 18, 0.4);
 border-right: 2px solid #00FC93;
 position: relative;
 overflow: hidden;
}

.ticker-icon .ticker-logo {
 width: 53px;
 height: 53px;
 fill: var(--accent-crawl);
 filter: drop-shadow(0 0 8px rgba(0, 252, 147, 0.6));
 position: relative;
 z-index: 2;
}

.ticker-icon .ticker-wave {
 position: absolute;
 width: 53px;
 height: 53px;
 z-index: 1;
 pointer-events: none;
 animation: svgPulse 8s ease-out infinite;
}

.ticker-icon .wave-1 {
 animation-delay: 0s;
}

.ticker-icon .wave-2 {
 animation-delay: -2s;
}

.ticker-icon .wave-3 {
 animation-delay: -4s;
}

.ticker-icon .wave-4 {
 animation-delay: -6s;
}

@keyframes svgPulse {
 0% {
   transform: scale(1);
   opacity: 0.6;
   filter: blur(0px);
 }
 50% {
   opacity: 0.3;
   filter: blur(3px);
 }
 100% {
   transform: scale(6);
   opacity: 0;
   filter: blur(8px);
 }
}

.ticker-icon svg {
 width: 53px;
 height: 53px;
 fill: var(--accent-crawl);
 filter: drop-shadow(0 0 8px rgba(0, 252, 147, 0.6));
 position: relative;
 z-index: 1;
}

.ticker-content {
 flex: 1;
 overflow: hidden;
 position: relative;
 height: 100%;
 display: flex;
 align-items: center;
 padding: 0 20px;
}

/* Right fade - shows when text overflows */
.ticker-content::after {
 content: '';
 position: absolute;
 right: 0;
 top: 0;
 width: 80px;
 height: 100%;
 background: linear-gradient(to left, 
   rgba(10, 10, 10, 1) 0%, 
   rgba(10, 10, 10, 0.9) 20%, 
   rgba(10, 10, 10, 0.6) 40%, 
   rgba(10, 10, 10, 0.3) 60%, 
   rgba(10, 10, 10, 0.1) 80%, 
   rgba(10, 10, 10, 0) 100%
 );
 z-index: 10;
 pointer-events: none;
 opacity: 0;
 transition: opacity 0.3s ease;
}

.ticker-content.has-overflow::after {
 opacity: 1;
}

a.ticker-item {
 position: absolute;
 white-space: nowrap;
 font-size: 45px;
 font-weight: 600;
 color: #fff;
 text-shadow: 0 0 10px rgba(255,255,255,0.1);
 opacity: 0;
 transform: translateX(30px);
 transition: opacity 0.4s ease, transform 0.4s ease;
 display: flex;
 align-items: center;
 padding-right: 40px;
 text-decoration: none;
 cursor: pointer;
 pointer-events: none;
}

a.ticker-item.active {
 opacity: 1;
 transform: translateX(0);
 pointer-events: auto;
}

a.ticker-item.exiting {
 opacity: 0;
 transform: translateX(-30px);
}

a.ticker-item.scrolling {
 transition: transform 0s ease;
}

a.ticker-item:hover {
 color: var(--accent-crawl);
}

.ticker-loading {
 font-size: 16px;
 color: rgba(255,255,255,0.5);
 font-style: italic;
}

#main-container {flex: 1;display: flex;overflow: hidden;}

#sidebar-left{
 height:100%;
 width: 40%;
 display:flex;
 flex-direction:column;
 background: var(--bg-secondary);
 border-left: 2px solid #00FC93;
 z-index:10;
}

#main-player-group{width:100%;display:flex;flex-direction:column;background: var(--bg-secondary);}
#main-video-frame{width:100%;height: 300px;position:relative;background:#000;overflow: hidden;}
#chat-wrapper{flex:1;background: var(--bg-secondary);position:relative;display:flex;flex-direction:column;overflow:hidden;}
#grid-right{flex:1;height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;background: var(--bg-color);gap: 0;}

.stream-card{background: var(--bg-secondary);display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;}
.stream-card:hover {z-index: 5;background: #111;}

.header-row{display:flex;width:100%;height:var(--header-height);background: var(--glass-bg);backdrop-filter: blur(20px);-webkit-backdrop-filter: blur(20px);position: relative;overflow: hidden;}
.header-row:hover {background: rgba(60, 60, 62, 0.75);}

.card-header{height:100%;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 16px;text-align:center;flex:1;min-width:0;position: relative;overflow: hidden;}
.card-header:hover{background: rgba(255, 255, 255, 0.08);}
.card-header:active{background: rgba(255, 255, 255, 0.12);}

.stream-title{font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;font-size: 30px;font-weight: 600;color: var(--text-secondary);text-transform: uppercase;letter-spacing: 0.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;text-align:center;text-shadow: 0 0 0 transparent;}
.card-header:hover .stream-title{color: var(--text-primary);text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);}

.viewer-badge{height:100%;display:none;align-items:center;justify-content:flex-end;padding: 0 16px;flex-shrink:0;min-width: 140px;box-shadow: inset 0 0 0 transparent;}
.viewer-badge:hover {filter: brightness(1.15);box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.1);}
.badge-main{background: #ff0505;color: #fff;}
.badge-1,.badge-2,.badge-3,.badge-4 {background: #b8b8b8;color: #1a1a1a;}
.badge-content{display:flex;align-items:center;justify-content: flex-end;gap: 8px;font-size: 33px;font-weight: 700;letter-spacing: -0.2px;font-variant-numeric: tabular-nums;min-width: 100px;text-align: right;text-shadow: 0 1px 2px rgba(0,0,0,0.2);}
.badge-content span {display: inline-block;flex: 1;text-align: right;}
.badge-content svg{width: 40px;height: 40px;fill: currentColor;opacity: 0.9;flex-shrink: 0;filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));}
.viewer-badge:hover .badge-content svg {opacity: 1;filter: drop-shadow(0 0 8px currentColor);}

/* Milestone Animation */
@keyframes milestone-pop {
  0% { transform: scale(1); filter: brightness(1); }
  50% { transform: scale(1.3); filter: brightness(1.5) drop-shadow(0 0 15px rgba(255, 255, 255, 0.8)); background-color: #fff; color: #ff0505; }
  100% { transform: scale(1); filter: brightness(1); }
}

.milestone-active {
  animation: milestone-pop 0.8s ease-in-out forwards;
}

/* Fetch struggling indicator - pulsing badge */
@keyframes badge-struggling {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.badge-struggling .badge-content span {
  animation: badge-struggling 2s ease-in-out infinite;
  color: inherit;
  opacity: 0.6;
}

.close-btn{height:100%;width: 48px;display:none;align-items:center;justify-content:center;background: rgba(255, 255, 255, 0.06);border:none;color: var(--text-secondary);font-size: 18px;font-weight: 400;cursor:pointer;flex-shrink:0;}
.close-btn:hover{background: var(--accent-red);color: #fff;box-shadow: 0 0 20px rgba(255, 69, 58, 0.4);}
.close-btn:active{opacity: 0.8;}
.close-btn svg {filter: drop-shadow(0 0 0 transparent);}
.close-btn:hover svg {transform: rotate(90deg);filter: drop-shadow(0 0 8px rgba(255,255,255,0.5));}

.video-container{flex:1;position:relative;background:#000;overflow: hidden;}
.stream-card:hover .video-container {box-shadow: inset 0 0 50px rgba(255,255,255,0.02);}
.video-container iframe,#main-video-frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}

#chat-wrapper .video-container{background: #0f0f0f;overflow:hidden;}
#chat-wrapper iframe{position:absolute;top:0;left:0;width:80%;height:80%;transform:scale(1.25);transform-origin:top left;border:none;background: #0f0f0f;}

.placeholder{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;flex-direction:column;color: var(--text-tertiary);gap: 8px;cursor: pointer;}
.placeholder:hover {background: rgba(255,255,255,0.02);}
.placeholder:hover h1 {opacity: 0.6;text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);}
.placeholder:hover p {opacity: 0.8;color: var(--text-secondary);}
.placeholder h1{font-size: 48px;font-weight: 700;opacity: 0.4;letter-spacing: -1px;text-shadow: 0 0 0 transparent;pointer-events: none;}
.placeholder p{font-size: 13px;font-weight: 500;opacity: 0.5;pointer-events: none;}
#ph-chat {cursor: default;pointer-events: none;}

#modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background: rgba(0, 0, 0, 0.75);backdrop-filter: blur(20px);-webkit-backdrop-filter: blur(20px);z-index:9999;display:none;justify-content:center;align-items:center;opacity: 0;}
#modal-overlay.active {opacity: 1;}
.modal-box{background: var(--glass-bg);backdrop-filter: blur(40px);-webkit-backdrop-filter: blur(40px);border: 1px solid var(--glass-border);border-radius: var(--radius-xl);width: 420px;padding: 24px;display:flex;flex-direction:column;gap: 16px;box-shadow: var(--shadow-lg);opacity: 0;}
#modal-overlay.active .modal-box {opacity: 1;}
.modal-title{color: var(--text-primary);font-size: 17px;font-weight: 600;text-align: center;padding-bottom: 8px;}
.modal-input{background: rgba(0, 0, 0, 0.3);border: 1px solid var(--glass-border);border-radius: var(--radius-md);color: var(--text-primary);padding: 14px 16px;font-size: 15px;font-family: inherit;width:100%;outline: none;}
.modal-input::placeholder{color: var(--text-tertiary);}
.modal-input:focus{border-color: var(--accent-blue);box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.25), 0 0 20px rgba(10, 132, 255, 0.15);}
.modal-actions{display:flex;justify-content: center;gap: 10px;padding-top: 8px;}
.btn-modal{padding: 12px 24px;font-weight: 600;font-size: 15px;font-family: inherit;cursor:pointer;border: none;border-radius: var(--radius-md);}
.btn-modal:active{opacity: 0.8;}
.btn-cancel{background: rgba(255, 255, 255, 0.1);color: var(--text-primary);}
.btn-cancel:hover{background: rgba(255, 255, 255, 0.18);box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);}
.btn-confirm{background: var(--accent-blue);color: #fff;}
.btn-confirm:hover{background: #0077ED;box-shadow: 0 0 25px rgba(10, 132, 255, 0.5);}

::-webkit-scrollbar {width: 8px;height: 8px;}
::-webkit-scrollbar-track {background: transparent;}
::-webkit-scrollbar-thumb {background: rgba(255, 255, 255, 0.15);border-radius: 4px;}
::-webkit-scrollbar-thumb:hover {background: rgba(255, 255, 255, 0.25);}
::selection {background: rgba(10, 132, 255, 0.4);}

@media (max-width:900px){
 #main-container { flex-direction:column; overflow-y:auto; }
 #sidebar-left{ width:100%; height:auto; }
 #chat-wrapper{ height:400px; }
 #grid-right{ height:800px; }
}
    </style>
  </head>

    <script>
/* ===== Promise.any Polyfill ===== */
if (typeof Promise.any !== 'function') {
  Promise.any = function(promises) {
    return new Promise(function(resolve, reject) {
      var errors = [];
      var pending = 0;
      var iterable = Array.from(promises);
      if (iterable.length === 0) {
        reject(new (typeof AggregateError === 'function' ? AggregateError : Error)('All promises were rejected'));
        return;
      }
      pending = iterable.length;
      iterable.forEach(function(promise, index) {
        Promise.resolve(promise).then(resolve).catch(function(error) {
          errors[index] = error;
          pending--;
          if (pending === 0) {
            reject(new (typeof AggregateError === 'function' ? AggregateError : Error)('All promises were rejected'));
          }
        });
      });
    });
  };
}

/* ===== AbortController Polyfill for older browsers ===== */
if (typeof AbortController === 'undefined') {
  window.AbortController = function() {
    this.signal = { aborted: false, addEventListener: function(){}, removeEventListener: function(){} };
    this.abort = function() { this.signal.aborted = true; };
  };
}

/* ===== Clear all localStorage on page load for fresh start ===== */
try {
  localStorage.removeItem('streamCommandConfig');
  localStorage.removeItem('proxyHealthData');
  localStorage.removeItem('viewerCountCache');
} catch(e) {}

/* ===== News Ticker ===== */
let tickerTitles = [];
let tickerLinks = [];
let currentTickerIndex = 0;
let tickerTimeout = null;
let lastFetchTime = 0;
let isFetchingTicker = false;

const DISPLAY_DURATION = 6000;
const HOLD_BEFORE_SCROLL = 1500;
const HOLD_AFTER_SCROLL = 2500;
const MIN_SCROLL_DURATION = 3000;
const BASE_URL = 'https://www.athletiko.gr/latest-news';
const MIN_WORD_COUNT = 3;
const TICKER_FETCH_INTERVAL = 120000;

function countWords(str) {
  if (!str) return 0;
  return str.trim().split(/\s+/).filter(w => w.length > 0).length;
}

async function fetchNewsTicker() {
  if (isFetchingTicker) {
    console.log('Ticker fetch already in progress, skipping...');
    return;
  }
  
  isFetchingTicker = true;
  const fetchStartTime = Date.now();
  
  const CORS_PROXIES = [
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
    url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
    url => `https://corsproxy.org/?url=${encodeURIComponent(url)}`
  ];
  
  const urlWithCacheBust = `${BASE_URL}?_t=${fetchStartTime}`;
  
  // Strategy 1: Race all proxies in parallel
  const parallelPromises = CORS_PROXIES.map(async (makeProxy) => {
    try {
      const proxyUrl = makeProxy(urlWithCacheBust);
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      
      const res = await fetch(proxyUrl, { 
        signal: controller.signal,
        cache: 'no-store',
        headers: {
          'Cache-Control': 'no-cache, no-store, must-revalidate',
          'Pragma': 'no-cache',
          'Expires': '0'
        }
      });
      clearTimeout(timeout);
      
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      
      const html = await res.text();
      if (!html || html.length < 500) throw new Error('Insufficient data');
      
      return html;
    } catch(e) {
      throw e;
    }
  });
  
  let html = null;
  
  try {
    html = await Promise.any(parallelPromises);
  } catch(e) {
    console.warn('Ticker: all parallel proxies failed, trying sequential...');
    // Strategy 2: Sequential fallback with longer timeout
    for (const makeProxy of CORS_PROXIES) {
      try {
        const proxyUrl = makeProxy(urlWithCacheBust);
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 20000);
        const res = await fetch(proxyUrl, { signal: controller.signal, cache: 'no-store' });
        clearTimeout(timeout);
        if (!res.ok) continue;
        html = await res.text();
        if (html && html.length >= 500) break;
        html = null;
      } catch(e2) { continue; }
    }
  }
  
  if (html) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    
    const titles = [];
    const links = [];
    
    const allAnchors = doc.querySelectorAll('a[href]');
    
    allAnchors.forEach(anchor => {
      const h2 = anchor.querySelector('h2');
      if (h2) {
        const text = h2.textContent?.trim();
        if (text && text.length > 5 && text.length < 200 && countWords(text) >= MIN_WORD_COUNT && !titles.includes(text)) {
          const rawHref = anchor.getAttribute('href');
          let href = 'https://www.athletiko.gr';
          
          if (rawHref) {
            if (rawHref.startsWith('http://') || rawHref.startsWith('https://')) {
              href = rawHref;
            } else if (rawHref.startsWith('//')) {
              href = 'https:' + rawHref;
            } else if (rawHref.startsWith('/')) {
              href = 'https://www.athletiko.gr' + rawHref;
            } else {
              href = 'https://www.athletiko.gr/' + rawHref;
            }
          }
          
          titles.push(text);
          links.push(href);
        }
      }
    });
    
    if (titles.length === 0) {
      const h2Elements = doc.querySelectorAll('h2');
      h2Elements.forEach(h2 => {
        const text = h2.textContent?.trim();
        if (text && text.length > 5 && text.length < 200 && countWords(text) >= MIN_WORD_COUNT && !titles.includes(text)) {
          let anchor = h2.closest('a') || h2.querySelector('a');
          let href = 'https://www.athletiko.gr';
          if (anchor) {
            const rawHref = anchor.getAttribute('href');
            if (rawHref) {
              if (rawHref.startsWith('http://') || rawHref.startsWith('https://')) {
                href = rawHref;
              } else if (rawHref.startsWith('//')) {
                href = 'https:' + rawHref;
              } else if (rawHref.startsWith('/')) {
                href = 'https://www.athletiko.gr' + rawHref;
              } else {
                href = 'https://www.athletiko.gr/' + rawHref;
              }
            }
          }
          titles.push(text);
          links.push(href);
        }
      });
    }
    
    if (titles.length > 0) {
      const hasNewContent = titles.some(title => !tickerTitles.includes(title));
      
      if (hasNewContent || tickerTitles.length === 0) {
        console.log(`Ticker updated: ${titles.length} articles found (${hasNewContent ? 'new content' : 'initial load'})`);
        tickerTitles = titles;
        tickerLinks = links;
        lastFetchTime = fetchStartTime;
        initTicker();
      } else {
        console.log('Ticker checked: no new articles');
      }
      
      isFetchingTicker = false;
      return;
    }
  }
  
  if (tickerTitles.length === 0) {
    console.warn('All ticker proxies failed, using fallback');
    tickerTitles = ['Sports News Updates', 'Live Match Coverage', 'Breaking Stories'];
    tickerLinks = ['https://www.athletiko.gr', 'https://www.athletiko.gr', 'https://www.athletiko.gr'];
    initTicker();
  }
  
  isFetchingTicker = false;
}

function initTicker() {
  const content = document.getElementById('ticker-content');
  if (!content || tickerTitles.length === 0) return;
  
  content.innerHTML = '';
  content.classList.remove('has-overflow');
  
  tickerTitles.forEach((title, i) => {
    const item = document.createElement('a');
    item.className = 'ticker-item';
    item.id = `ticker-item-${i}`;
    item.href = tickerLinks[i];
    item.target = '_blank';
    item.rel = 'noopener noreferrer';
    item.textContent = title;
    content.appendChild(item);
  });
  
  showTickerItem(0);
}

function showTickerItem(index) {
  if (tickerTimeout) clearTimeout(tickerTimeout);
  
  const content = document.getElementById('ticker-content');
  content.classList.remove('has-overflow');
  
  document.querySelectorAll('.ticker-item').forEach(item => {
    item.classList.remove('active', 'exiting', 'scrolling');
    item.style.transform = 'translateX(30px)';
    item.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
  });
  
  currentTickerIndex = index;
  
  const item = document.getElementById(`ticker-item-${index}`);
  if (!item || !content) return;
  
  const contentWidth = content.clientWidth - 48;
  const itemWidth = item.scrollWidth;
  const overflow = itemWidth - contentWidth;
  
  if (overflow > 0) {
    content.classList.add('has-overflow');
  }
  
  item.style.transform = 'translateX(0)';
  item.classList.add('active');
  
  setTimeout(() => {
    if (overflow > 0) {
      handleLongText(item, overflow, content);
    } else {
      tickerTimeout = setTimeout(() => {
        transitionToNext();
      }, DISPLAY_DURATION);
    }
  }, 100);
}

function handleLongText(item, overflow, content) {
  tickerTimeout = setTimeout(() => {
    const scrollDistance = overflow + 30;
    const calculatedDuration = (scrollDistance / 80) * 1000;
    const scrollDuration = Math.max(MIN_SCROLL_DURATION, calculatedDuration);
    
    item.classList.add('scrolling');
    item.style.transition = `transform ${scrollDuration}ms ease-in-out`;
    item.style.transform = `translateX(-${scrollDistance}px)`;
    
    tickerTimeout = setTimeout(() => {
      tickerTimeout = setTimeout(() => {
        transitionToNext();
      }, HOLD_AFTER_SCROLL);
    }, scrollDuration);
    
  }, HOLD_BEFORE_SCROLL);
}

function transitionToNext() {
  const content = document.getElementById('ticker-content');
  
  const currentItem = document.getElementById(`ticker-item-${currentTickerIndex}`);
  if (currentItem) {
    currentItem.classList.remove('active', 'scrolling');
    currentItem.classList.add('exiting');
    currentItem.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
  }
  
  content.classList.remove('has-overflow');
  
  const nextIndex = (currentTickerIndex + 1) % tickerTitles.length;
  
  setTimeout(() => {
    showTickerItem(nextIndex);
  }, 400);
}

fetchNewsTicker();
setInterval(fetchNewsTicker, TICKER_FETCH_INTERVAL);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - lastFetchTime > 60000) {
    console.log('Page became visible, checking for ticker updates...');
    fetchNewsTicker();
  }
});

/* ===== YouTube IFrame API ===== */
function onYouTubeIframeAPIReady() {
  if (window.app) {
    window.app.ytApiReady = true;
    window.app.onYTApiReady();
  }
}

/* ===== Main App ===== */
class StreamApp {
  constructor() {
    this.modal = document.getElementById('modal-overlay');
    this.inputUrl = document.getElementById('modal-url');
    this.activeSlot = null;
    this.slotStates = {};
    this.players = {};
    this.ytApiReady = false;
    this.pendingLoads = [];
    this.currentUnmutedSlot = null;
    this.muteCheckInterval = null;
    this.lastCounts = {};
    this.TARGET_QUALITY = 'hd720';
    this.MIN_INTERVAL_MS = 4000;
    this.FETCH_TIMEOUT = 12000;
    this.SEQUENTIAL_TIMEOUT = 18000;
    
    // Simple proxy list - straightforward approach
    this.CORS_PROXIES = [
      { fn: url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, id: 'allorigins-raw', type: 'raw' },
      { fn: url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`, id: 'corsproxy-io', type: 'raw' },
      { fn: url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`, id: 'codetabs', type: 'raw' },
      { fn: url => `https://corsproxy.org/?url=${encodeURIComponent(url)}`, id: 'corsproxy-org', type: 'raw' },
      { fn: url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, id: 'allorigins-get', type: 'json' },
      { fn: url => `https://thingproxy.freeboard.io/fetch/${url}`, id: 'thingproxy', type: 'raw' },
    ];

    // Fresh proxy health (no localStorage)
    this.proxyHealth = {};
    this.CORS_PROXIES.forEach(p => {
      this.proxyHealth[p.id] = { successes: 0, failures: 0, lastSuccess: 0, avgResponseTime: 5000, blocked: false };
    });

    this.userIconSVG = '<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
    
    // Track online/offline status
    this._isOnline = navigator.onLine !== false;
    window.addEventListener('online', () => { 
      this._isOnline = true; 
      console.log('[Network] Back online - resuming fetches');
      Object.keys(this.slotStates).forEach(slot => {
        const st = this.slotStates[slot];
        if (st && st.vidId && st.realtimeActive) {
          st.consecutiveFailures = 0;
          this._fetchAndUpdate(slot);
        }
      });
    });
    window.addEventListener('offline', () => { 
      this._isOnline = false; 
      console.warn('[Network] Offline detected - pausing fetches');
    });
    
    // No loadConfig - always start fresh
  }

  onYTApiReady() {
    this.pendingLoads.forEach(item => this.createYTPlayer(item.slot, item.vidId));
    this.pendingLoads = [];
    this.startMutePolling();
  }

  setQuality720p(player) {
    try {
      if (player && typeof player.setPlaybackQuality === 'function') player.setPlaybackQuality(this.TARGET_QUALITY);
      if (player && typeof player.setPlaybackQualityRange === 'function') player.setPlaybackQualityRange(this.TARGET_QUALITY, this.TARGET_QUALITY);
    } catch(e) {}
  }

  createYTPlayer(slot, vidId) {
    const ph = document.getElementById(`ph-${slot}`);
    const container = document.getElementById(`player-${slot}`)?.parentElement;
    if (!container) return;
    if (this.players[slot]) { try { this.players[slot].destroy(); } catch(e) {} delete this.players[slot]; }
    const oldDiv = document.getElementById(`player-${slot}`);
    if (oldDiv) oldDiv.remove();
    const newDiv = document.createElement('div');
    newDiv.id = `player-${slot}`;
    newDiv.style.cssText = 'display:block;position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;';
    container.appendChild(newDiv);
    if (ph) ph.style.display = 'none';
    
    const playerOrigin = (window.location.protocol === 'file:') ? 'https://www.youtube.com' : window.location.origin;
    
    this.players[slot] = new YT.Player(`player-${slot}`, {
      videoId: vidId,
      host: 'https://www.youtube-nocookie.com',
      playerVars: { autoplay: 1, mute: 1, controls: 1, disablekb: 0, enablejsapi: 1, fs: 1, iv_load_policy: 3, modestbranding: 1, playsinline: 1, rel: 0, showinfo: 0, cc_load_policy: 0, origin: playerOrigin, vq: 'hd720' },
      events: { 'onReady': (e) => this.onPlayerReady(e, slot), 'onStateChange': (e) => this.onPlayerStateChange(e, slot), 'onPlaybackQualityChange': (e) => this.onQualityChange(e, slot), 'onError': (e) => this.onPlayerError(e, slot) }
    });
  }

  onPlayerReady(event, slot) { const player = event.target; player.playVideo(); this.setQuality720p(player); const playerDiv = document.getElementById(`player-${slot}`); if (playerDiv) playerDiv.style.opacity = '1'; }
  onPlayerStateChange(event, slot) { if (event.data === YT.PlayerState.PLAYING) this.setQuality720p(event.target); }
  onQualityChange(event, slot) { if (event.data !== this.TARGET_QUALITY) this.setQuality720p(event.target); }
  onPlayerError(event, slot) {}

  startMutePolling() { if (this.muteCheckInterval) return; this.muteCheckInterval = setInterval(() => this.enforceSingleUnmuted(), 250); }

  enforceSingleUnmuted() {
    const slots = Object.keys(this.players);
    let unmutedSlots = [];
    for (const slot of slots) { const player = this.players[slot]; if (!player) continue; try { if (typeof player.isMuted === 'function' && !player.isMuted()) unmutedSlots.push(slot); } catch(e) {} }
    if (unmutedSlots.length > 1) { const newUnmuted = unmutedSlots.find(s => s !== this.currentUnmutedSlot) || unmutedSlots[0]; for (const slot of unmutedSlots) { if (slot !== newUnmuted && this.players[slot]) { try { this.players[slot].mute(); } catch(e) {} } } this.currentUnmutedSlot = newUnmuted; } else if (unmutedSlots.length === 1) { this.currentUnmutedSlot = unmutedSlots[0]; } else { this.currentUnmutedSlot = null; }
  }

  buildChatUrl(vidId) { const domain = window.location.hostname || 'localhost'; return `https://www.youtube.com/live_chat?v=${vidId}&embed_domain=${domain}&dark_theme=1`; }

  openModal(slotId) { this.activeSlot = slotId; if (this.modal) { this.modal.style.display = 'flex'; requestAnimationFrame(() => this.modal.classList.add('active')); } if (this.inputUrl) { this.inputUrl.value = ''; setTimeout(() => this.inputUrl.focus(), 100); } }
  closeModal() { if (this.modal) { this.modal.classList.remove('active'); setTimeout(() => this.modal.style.display = 'none', 150); } this.activeSlot = null; }
  confirmModal() { if (!this.activeSlot) return; const url = (this.inputUrl?.value || '').trim(); const vidId = this.getId(url); if (!vidId) { alert('Invalid YouTube URL'); return; } const slot = this.activeSlot; this.closeModal(); this.loadVideo(slot, vidId, url); this.fetchChannelName(url, slot); }

  loadVideo(slot, vidId, originalUrl = null) {
    if (!slot || !vidId) return;
    const isMain = (slot === 'main');
    this._stopRealtimeLoop(slot);
    const titleEl = document.getElementById(`title-${slot}`); if (titleEl) { titleEl.innerText = 'Connecting...'; titleEl.style.color = 'var(--accent-blue)'; }
    if (this.ytApiReady && window.YT && window.YT.Player) { this.createYTPlayer(slot, vidId); } else { this.pendingLoads = this.pendingLoads.filter(p => p.slot !== slot); this.pendingLoads.push({ slot, vidId }); }
    if (isMain) { const chatFrame = document.getElementById('frame-chat'); const chatPh = document.getElementById('ph-chat'); if (chatFrame && chatPh) { chatPh.style.display = 'none'; chatFrame.style.display = 'block'; chatFrame.src = this.buildChatUrl(vidId); } }
    this._ensureSlotState(slot); this.slotStates[slot].vidId = vidId; this.slotStates[slot].originalUrl = originalUrl;
    const badge = document.getElementById(`badge-${slot}`); if (badge) badge.style.display = 'flex';
    const closeBtn = document.getElementById(`close-${slot}`); if (closeBtn) closeBtn.style.display = 'flex';
    this._startRealtimeLoop(slot);
  }

  closeStream(slot) {
    if (!slot) return;
    const isMain = (slot === 'main');
    this._stopRealtimeLoop(slot);
    const titleEl = document.getElementById(`title-${slot}`); if (titleEl) { titleEl.innerText = 'Click to Add Stream'; titleEl.style.color = ''; }
    if (this.players[slot]) { try { this.players[slot].destroy(); } catch(e) {} delete this.players[slot]; }
    const container = document.getElementById(`player-${slot}`)?.parentElement;
    if (container) { const oldDiv = document.getElementById(`player-${slot}`); if (oldDiv) oldDiv.remove(); const newDiv = document.createElement('div'); newDiv.id = `player-${slot}`; newDiv.style.cssText = 'display:none;position:absolute;top:0;left:0;width:100%;height:100%;'; container.appendChild(newDiv); }
    const ph = document.getElementById(`ph-${slot}`); if (ph) ph.style.display = 'flex';
    const badge = document.getElementById(`badge-${slot}`); 
    if (badge) { badge.style.display = 'none'; badge.classList.remove('badge-struggling'); }
    const closeBtn = document.getElementById(`close-${slot}`); if (closeBtn) closeBtn.style.display = 'none';
    if (isMain) { const chatFrame = document.getElementById('frame-chat'); const chatPh = document.getElementById('ph-chat'); if (chatFrame) { chatFrame.style.display = 'none'; chatFrame.src = ''; } if (chatPh) chatPh.style.display = 'flex'; }
    if (this.slotStates[slot]) { this.slotStates[slot].vidId = null; this.slotStates[slot].originalUrl = null; }
    if (this.currentUnmutedSlot === slot) this.currentUnmutedSlot = null;
  }

  async fetchChannelName(videoUrl, slot) { 
    const services = [
      `https://noembed.com/embed?url=${encodeURIComponent(videoUrl)}`,
      `https://www.youtube.com/oembed?url=${encodeURIComponent(videoUrl)}&format=json`
    ];
    
    for (const serviceUrl of services) {
      try { 
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        const res = await fetch(serviceUrl, { signal: controller.signal }); 
        clearTimeout(timeout);
        const data = await res.json(); 
        const titleEl = document.getElementById(`title-${slot}`); 
        if (!titleEl) return; 
        if (data.author_name) { 
          titleEl.innerText = data.author_name; 
          titleEl.style.color = 'var(--text-primary)'; 
          return;
        }
      } catch (e) { 
        continue;
      }
    }
    
    const titleEl = document.getElementById(`title-${slot}`); 
    if (titleEl) { 
      titleEl.innerText = 'Connected'; 
      titleEl.style.color = 'var(--text-secondary)'; 
    } 
  }

  _ensureSlotState(slot) { if (!this.slotStates[slot]) { this.slotStates[slot] = { vidId: null, timerId: null, lastFetchTime: 0, fetching: false, realtimeActive: false, originalUrl: null, consecutiveFailures: 0, lastGoodValue: null }; } }
  
  _startRealtimeLoop(slot) { 
    this._ensureSlotState(slot); 
    this.slotStates[slot].realtimeActive = true; 
    this.slotStates[slot].consecutiveFailures = 0;
    this._fetchAndUpdate(slot).finally(() => this._scheduleNextFetch(slot)); 
  }
  
  _stopRealtimeLoop(slot) { const st = this.slotStates[slot]; if (!st) return; st.realtimeActive = false; if (st.timerId) { clearTimeout(st.timerId); st.timerId = null; } }
  
  _scheduleNextFetch(slot) { 
    const st = this.slotStates[slot]; 
    if (!st || !st.realtimeActive) return; 
    
    // Dynamic interval: back off on consecutive failures
    let interval = this.MIN_INTERVAL_MS;
    if (st.consecutiveFailures > 0) {
      interval = Math.min(30000, this.MIN_INTERVAL_MS * Math.pow(1.5, st.consecutiveFailures));
    }
    
    const elapsed = st.lastFetchTime ? (Date.now() - st.lastFetchTime) : interval; 
    const wait = Math.max(0, interval - elapsed); 
    st.timerId = setTimeout(async () => { 
      if (!st.realtimeActive) return; 
      await this._fetchAndUpdate(slot); 
      this._scheduleNextFetch(slot); 
    }, wait); 
  }

  async _fetchAndUpdate(slot) { 
    const st = this.slotStates[slot]; 
    if (!st || !st.vidId || st.fetching) return; 
    
    if (!this._isOnline) {
      console.warn(`[Slot ${slot}] Offline - skipping fetch`);
      return;
    }
    
    st.fetching = true; 
    const badge = document.getElementById(`badge-${slot}`);
    
    try { 
      const html = await this._fetchYouTubePage(st.vidId); 
      st.lastFetchTime = Date.now(); 
      
      if (!html) { 
        st.consecutiveFailures = (st.consecutiveFailures || 0) + 1;
        
        if (st.consecutiveFailures >= 3 && badge) {
          badge.classList.add('badge-struggling');
        }
        
        if (st.consecutiveFailures <= 3 && st.lastGoodValue) {
          console.warn(`[Slot ${slot}] Fetch failed (attempt ${st.consecutiveFailures}), keeping last value: ${st.lastGoodValue}`);
        } else if (st.consecutiveFailures > 3) {
          this._updateBadgeText(slot, '—'); 
          console.warn(`[Slot ${slot}] Fetch failed ${st.consecutiveFailures} times, showing dash`);
        }
        return; 
      } 
      
      // Reset failure counter on success
      st.consecutiveFailures = 0;
      if (badge) badge.classList.remove('badge-struggling');
      
      const data = this._extractViewerData(html); 
      console.log(`[Slot ${slot}] Extracted:`, JSON.stringify(data));
      
      let num = null; 
      
      // concurrentViewers only exists on live streams - use directly
      if (data.concurrentViewers) {
        num = this._parseNumber(data.concurrentViewers); 
      }
      // "watching" text only appears on live streams - use directly
      if (num === null && data.viewCountText && /watching/i.test(data.viewCountText)) {
        num = this._parseNumber(data.viewCountText);
      }
      // No live viewer data found → not live or extraction failed → dash
      
      if (num !== null && !isNaN(num)) { 
        const formatted = this._formatNumber(num);
        this._updateBadgeText(slot, formatted);
        st.lastGoodValue = formatted;
        
        if (slot === 'main') {
          const prev = this.lastCounts[slot] || 0;
          const currentThousand = Math.floor(num / 1000);
          const prevThousand = Math.floor(prev / 1000);
          
          if (prev > 0 && currentThousand > prevThousand) {
             this.triggerMilestoneAnim();
          }
          this.lastCounts[slot] = num;
        }
      } else { 
        this._updateBadgeText(slot, '—');
      } 
      
    } catch (e) { 
      st.consecutiveFailures = (st.consecutiveFailures || 0) + 1;
      if (st.consecutiveFailures >= 3 && badge) {
        badge.classList.add('badge-struggling');
      }
      if (st.consecutiveFailures > 3) {
        this._updateBadgeText(slot, '—'); 
      }
      console.warn(`[Slot ${slot}] Fetch error:`, e.message || e);
    } finally { 
      st.fetching = false; 
    } 
  }

  triggerMilestoneAnim() {
    const badge = document.getElementById('badge-main');
    if (!badge) return;
    badge.classList.remove('milestone-active');
    void badge.offsetWidth;
    badge.classList.add('milestone-active');
  }

  _updateBadgeText(slot, numText) { const container = document.getElementById(`badge-content-${slot}`); if (!container) return; container.innerHTML = `<span>${this._escapeHtml(String(numText))}</span>${this.userIconSVG}`; }
  
  _escapeHtml(s) { 
    const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
    return s.replace(/[&<>"']/g, function(m) { return map[m]; }); 
  }

  // Sort proxies by health score, excluding blocked ones
  _getSortedProxies() {
    const now = Date.now();
    return this.CORS_PROXIES
      .map(proxy => {
        const h = this.proxyHealth[proxy.id] || { successes: 0, failures: 0, lastSuccess: 0, avgResponseTime: 5000 };
        const recency = h.lastSuccess ? Math.max(0, 1 - (now - h.lastSuccess) / 600000) : 0;
        const score = (h.successes * 3) - (h.failures * 2) + (recency * 5) - (h.avgResponseTime / 2000);
        return { ...proxy, health: h, score };
      })
      .filter(p => !p.health.blocked)
      .sort((a, b) => b.score - a.score);
  }

  async _tryFetchWithProxy(proxy, url, timeout) {
    const proxyUrl = proxy.fn(url);
    const controller = new AbortController();
    const to = setTimeout(() => controller.abort(), timeout);
    const startTime = Date.now();
    
    try {
      const res = await fetch(proxyUrl, { 
        signal: controller.signal, 
        headers: { 'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' }, 
        cache: 'no-store',
        mode: 'cors',
        credentials: 'omit'
      });
      clearTimeout(to);
      
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      
      let text = await res.text();
      const elapsed = Date.now() - startTime;
      
      // Handle JSON-wrapped responses (allorigins /get endpoint)
      if (proxy.type === 'json' && text.startsWith('{')) {
        try {
          const json = JSON.parse(text);
          if (json.contents) text = json.contents;
          else if (json.data) text = json.data;
        } catch(e) {}
      }
      
      // Validate response is a real YouTube page, not consent/error page
      if (!text || text.length < 800) {
        throw new Error('Response too short');
      }
      const hasYTMarkers = text.includes('ytInitialPlayerResponse') || text.includes('ytInitialData') || text.includes('videoDetails');
      const hasLiveHints = text.includes('concurrentViewers') || text.includes('watching now') || text.includes('"isLive"');
      if (!hasYTMarkers && !hasLiveHints) {
        throw new Error('Not a YouTube video page (consent/error page)');
      }
      
      // Track success
      const h = this.proxyHealth[proxy.id];
      if (h) {
        h.successes++;
        h.lastSuccess = Date.now();
        h.avgResponseTime = Math.round((h.avgResponseTime * 0.7) + (elapsed * 0.3));
      }
      
      console.log(`[Proxy] ${proxy.id} succeeded in ${elapsed}ms`);
      return text;
    } catch (err) {
      clearTimeout(to);
      const h = this.proxyHealth[proxy.id];
      if (h) {
        h.failures++;
        if (h.failures > 5 && (!h.lastSuccess || Date.now() - h.lastSuccess > 120000)) {
          h.blocked = true;
          setTimeout(() => { h.blocked = false; }, 120000);
          console.warn(`[Proxy] ${proxy.id} temporarily blocked after ${h.failures} failures`);
        }
      }
      throw err;
    }
  }

  async _fetchYouTubePage(vidId) { 
    const url = `https://www.youtube.com/watch?v=${vidId}&hl=en&gl=US&has_verified=1&bpctr=9999999999&t=${Date.now()}`; 
    const sortedProxies = this._getSortedProxies();
    
    if (sortedProxies.length === 0) {
      console.warn('[Proxy] All proxies blocked, resetting...');
      this.CORS_PROXIES.forEach(p => {
        if (this.proxyHealth[p.id]) this.proxyHealth[p.id].blocked = false;
      });
      return null;
    }
    
    // Strategy 1: Race the top proxies in parallel (fastest wins)
    const topProxies = sortedProxies.slice(0, Math.min(4, sortedProxies.length));
    const parallelPromises = topProxies.map(proxy => 
      this._tryFetchWithProxy(proxy, url, this.FETCH_TIMEOUT)
    );
    
    try { 
      const result = await Promise.any(parallelPromises);
      if (result) return result;
    } catch (e) { 
      console.warn('[Viewer Fetch] All parallel attempts failed, trying sequential...');
    }
    
    // Strategy 2: Sequential fallback with longer timeout
    for (const proxy of sortedProxies) {
      try {
        const result = await this._tryFetchWithProxy(proxy, url, this.SEQUENTIAL_TIMEOUT);
        if (result) {
          console.log(`[Viewer Fetch] Sequential fallback succeeded with ${proxy.id}`);
          return result;
        }
      } catch(e) {}
    }
    
    // Strategy 3: Try mobile YouTube URL
    const mobileUrl = `https://m.youtube.com/watch?v=${vidId}&hl=en&gl=US&has_verified=1&bpctr=9999999999&t=${Date.now()}`;
    const topTwo = sortedProxies.slice(0, 2);
    for (const proxy of topTwo) {
      try {
        const result = await this._tryFetchWithProxy(proxy, mobileUrl, this.SEQUENTIAL_TIMEOUT);
        if (result) {
          console.log(`[Viewer Fetch] Mobile URL fallback succeeded with ${proxy.id}`);
          return result;
        }
      } catch(e) {}
    }
    
    console.error(`[Viewer Fetch] All fetch strategies exhausted for video ${vidId}`);
    return null; 
  }

  _extractEmbeddedJSON(html, varName) { if (!html || !varName) return null; const idx = html.indexOf(varName); if (idx === -1) return null; let start = html.indexOf('{', idx); if (start === -1) return null; let depth = 0, inStr = false, esc = false; for (let i = start; i < html.length; i++) { const ch = html[i]; if (esc) { esc = false; continue; } if (ch === '\\') { esc = true; continue; } if (ch === '"') { inStr = !inStr; continue; } if (inStr) continue; if (ch === '{') depth++; else if (ch === '}') { depth--; if (depth === 0) { try { return JSON.parse(html.substring(start, i+1)); } catch(e){ return null; } } } } return null; }

  _extractViewerData(html) { 
    const result = { concurrentViewers: null, totalViews: null, isLive: false, isLiveNow: false, title: null, viewCountText: null }; 
    
    // STEP 1: Fast regex scan (before slow JSON parsing)
    const cvMatch = html.match(/"concurrentViewers"\s*:\s*"(\d+)"/);
    if (cvMatch) {
      result.concurrentViewers = cvMatch[1];
      result.isLiveNow = true;
      result.isLive = true;
    }
    if (html.includes('"isLiveNow":true')) { result.isLiveNow = true; result.isLive = true; }
    if (html.includes('"isLive":true')) { result.isLiveNow = true; result.isLive = true; }
    if (html.includes('"isLiveContent":true')) result.isLive = true;
    if (!result.concurrentViewers) {
      const wm = html.match(/([\d,.\s]+)\s*watching\s*now/i);
      if (wm) { result.viewCountText = wm[0]; result.isLiveNow = true; result.isLive = true; }
    }
    if (!result.concurrentViewers && !result.viewCountText) {
      const sm = html.match(/"simpleText"\s*:\s*"([^"]*\d[^"]*watching[^"]*)"/i);
      if (sm) { result.viewCountText = sm[1]; result.isLiveNow = true; }
      const rm = html.match(/"text"\s*:\s*"([\d,.\s]+)"\s*\}\s*,\s*\{\s*"text"\s*:\s*"\s*watching/i);
      if (rm) { result.viewCountText = rm[1] + ' watching now'; result.isLiveNow = true; }
    }
    // If regex already found concurrentViewers, skip slow JSON parsing
    if (result.concurrentViewers) return result;
    
    // STEP 2: JSON extraction fallback
    let pr = this._extractEmbeddedJSON(html, 'ytInitialPlayerResponse'); 
    if (!pr) pr = this._extractEmbeddedJSON(html, 'window["ytInitialPlayerResponse"]') || this._extractEmbeddedJSON(html, 'window.ytInitialPlayerResponse'); 
    
    if (pr) { 
      const vd = pr.videoDetails; 
      if (vd) { 
        result.title = vd.title || null; 
        result.totalViews = vd.viewCount || null; 
        result.isLive = !!vd.isLive || !!vd.isLiveContent; 
      } 
      const lbd = pr?.microformat?.playerMicroformatRenderer?.liveBroadcastDetails; 
      if (lbd) { 
        if (lbd.concurrentViewers) result.concurrentViewers = lbd.concurrentViewers; 
        result.isLiveNow = !!lbd.isLiveNow || result.isLive; 
      } 
    } 
    
    const init = this._extractEmbeddedJSON(html, 'ytInitialData'); 
    if (init) { 
      try { 
        const contents = init?.contents?.twoColumnWatchNextResults?.results?.results?.contents; 
        if (contents && Array.isArray(contents)) { 
          for (const item of contents) { 
            const vcr = item?.videoPrimaryInfoRenderer?.viewCount?.videoViewCountRenderer; 
            if (vcr) { 
              if (vcr.viewCount?.simpleText) result.viewCountText = vcr.viewCount.simpleText; 
              else if (vcr.viewCount?.runs) result.viewCountText = vcr.viewCount.runs.map(r=>r.text).join(''); 
              if (vcr.isLive) result.isLiveNow = true; 
            } 
          } 
        } 
      } catch(e){} 
    } 
    
    // Regex fallback: concurrentViewers (only exists on live streams)
    if (!result.concurrentViewers) { 
      const m1 = html.match(/"concurrentViewers"\s*:\s*"(\d+)"/i); 
      if (m1) { 
        result.concurrentViewers = m1[1];
        result.isLiveNow = true; // concurrentViewers only exists on live streams
      } 
    }
    
    // Regex fallback: "X watching now" text (only appears on live streams)
    if (!result.concurrentViewers && !result.viewCountText) {
      const m2 = html.match(/([\d,.\s]+)\s*watching\s*now/i);
      if (m2) {
        result.viewCountText = m2[0];
        result.isLiveNow = true; // "watching now" only appears on live streams
      }
    }
    
    // Regex fallback: viewCount simpleText containing "watching"
    if (!result.concurrentViewers && !result.viewCountText) {
      const m3 = html.match(/"viewCount"\s*:\s*\{\s*"simpleText"\s*:\s*"([^"]*watching[^"]*)"/i);
      if (m3) {
        result.viewCountText = m3[1];
        result.isLiveNow = true;
      }
      const m4 = html.match(/"text"\s*:\s*"([\d,.\s]+)"\s*\}\s*,\s*\{\s*"text"\s*:\s*"\s*watching/i);
      if (m4) {
        result.viewCountText = m4[1] + ' watching now';
        result.isLiveNow = true;
      }
    }
    
    // Regex fallback: check raw HTML for live flags if JSON extraction missed them
    if (!result.isLiveNow && !result.isLive) {
      if (html.includes('"isLiveNow":true') || html.includes('"isLive":true') || html.includes('"isLiveContent":true')) {
        result.isLiveNow = true;
        result.isLive = true;
      }
    }
    
    return result; 
  }

  _parseNumber(s) { if (s == null) return null; const m = String(s).match(/([\d.,]+)/); if (!m) return null; const digits = m[1].replace(/[^\d]/g, ''); return digits ? parseInt(digits, 10) : null; }
  _formatNumber(n) { if (typeof n !== 'number') n = Number(n) || 0; return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
  getId(url) { if (!url) return null; url = url.trim(); if (/^[A-Za-z0-9_-]{11}$/.test(url)) return url; const m = url.match(/(?:youtube\.com\/watch\?.*v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/live\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/); if (m) return m[1]; try { const v = new URL(url).searchParams.get('v'); if (v && /^[A-Za-z0-9_-]{11}$/.test(v)) return v; } catch(e){} return null; }
}

const app = new StreamApp();
window.app = app;

document.getElementById('modal-url')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') window.app.confirmModal(); });
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') app.closeModal(); });
    </script>
